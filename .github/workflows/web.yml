# The web demo (web/): checks on pull requests, deploys to GitHub Pages on
# pushes to main. Independent of the server's Docker CI. See docs/DECISIONS.md (11).
name: Web demo

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

# PR runs cancel older ones; deploys finish, as GitHub recommends for Pages.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check (typecheck, tests, build)
        run: npm run check
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          VITE_BACKEND_URL: ${{ vars.DEMO_BACKEND_URL }}
          VITE_MAX_UPLOAD_MB: ${{ vars.DEMO_MAX_UPLOAD_MB }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
