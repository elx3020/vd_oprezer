# A version tag (v1.2.3) publishes the runtime image to GHCR as
# ghcr.io/<owner>/<repo>:1.2.3, :1.2 and :latest. See docs/DECISIONS.md (11).
name: CD

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # `vd-oprezer version` reads package.json, so the image must match its tag.
      - name: Tag matches package.json version
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # A tag can point at any commit, so check it again; main's cache usually makes this quick.
      - name: Check (docker build --target test)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha
      - name: Publish runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
